<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="description" content="A quick quiz about our golu display: can you find everything on the right step?">
<title>Golu Quiz</title>
<style>
  :root {
    --bg: #f6f2ea;
    --surface: #fffdf9;
    --ink: #1d1a17;
    --muted: #6b635a;
    --line: rgba(29, 26, 23, 0.12);
    --accent: #b45309;
    --accent-ink: #ffffff;
    --good: #1b7a45;
    --good-bg: #e2f2e8;
    --bad: #b3261e;
    --bad-bg: #fbe8e6;
    --glass: rgba(246, 242, 234, 0.72);
    --shadow: 0 1px 2px rgba(29, 26, 23, 0.06), 0 8px 24px rgba(29, 26, 23, 0.06);
    --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14110f;
      --surface: #1f1b18;
      --ink: #f4efe8;
      --muted: #a39a8f;
      --line: rgba(244, 239, 232, 0.14);
      --accent: #f0a040;
      --accent-ink: #1a1208;
      --good: #5fd08a;
      --good-bg: #14301f;
      --bad: #ff8a80;
      --bad-bg: #3a1a17;
      --glass: rgba(20, 17, 15, 0.7);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  /* Translucent header: content scrolls underneath */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--line);
    padding: env(safe-area-inset-top) max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
  }
  .bar-inner { max-width: 38rem; margin: 0 auto; padding: 0.7rem 0 0.6rem; }
  .bar-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .brand { font-size: 1.0625rem; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .counter { font-size: 0.875rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .note { margin: 0.2rem 0 0; font-size: 0.875rem; line-height: 1.4; color: var(--muted); letter-spacing: 0.005em; }
  .note b { color: var(--ink); font-weight: 650; }
  .progress { height: 3px; background: var(--line); border-radius: 2px; margin-top: 0.6rem; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform 0.5s var(--ease); }

  main {
    max-width: 38rem;
    margin: 0 auto;
    padding: 1.25rem max(1rem, env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    padding: clamp(1.25rem, 4vw, 2rem);
    box-shadow: var(--shadow);
  }
  .eyebrow { margin: 0 0 0.5rem; font-size: 0.8125rem; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
  h1, h2 { margin: 0; font-weight: 700; }
  h1 { font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.05; letter-spacing: -0.025em; }
  h2.q { font-size: clamp(1.5rem, 5vw, 1.875rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 1.25rem; }
  .lede { color: var(--muted); font-size: 1.0625rem; margin: 0.9rem 0 1.5rem; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 3.25rem; padding: 0 1.75rem;
    border: 0; border-radius: 1rem;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 650; font-size: 1.0625rem; letter-spacing: -0.005em;
    cursor: pointer;
    transition: transform 100ms ease-out, filter 150ms ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.block { width: 100%; }
  .btn[hidden] { display: none; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }

  .opts { display: flex; flex-direction: column; gap: 0.625rem; }
  .opt {
    position: relative;
    display: flex; align-items: center;
    width: 100%; min-height: 3.25rem;
    padding: 0.7rem 2.75rem 0.7rem 1.1rem;
    text-align: left;
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 1rem;
    font-size: 1.0625rem; font-weight: 550;
    cursor: pointer;
    transition: transform 100ms ease-out, background-color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  }
  .opt:active { transform: scale(0.98); }
  @media (hover: hover) { .opt:hover:not([aria-disabled="true"]) { border-color: var(--accent); } }
  .opt[aria-disabled="true"] { cursor: default; }
  .opt[aria-disabled="true"]:active { transform: none; }
  .opt .mark { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 1.125rem; }
  .opt.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt.dim { opacity: 0.5; }

  /* Step options mirror the physical golu: top step on top, floor on the bottom, widening like a tiered stand */
  .opts.steps { gap: 0.5rem; }
  .opts.steps .opt { width: var(--w, 100%); margin-inline: auto; justify-content: center; text-align: center; padding-inline: 2.5rem; }
  .cap { text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 0.5rem; }

  .feedback { margin-top: 1rem; padding: 0.85rem 1rem; border-radius: 1rem; font-size: 1rem; line-height: 1.45; display: none; }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { font-weight: 700; }
  .next { margin-top: 1rem; width: 100%; }

  .score { font-size: clamp(3.5rem, 16vw, 5.5rem); font-weight: 750; letter-spacing: -0.04em; line-height: 1; margin: 0.5rem 0 0.25rem; font-variant-numeric: tabular-nums; }
  .score small { font-size: 0.4em; font-weight: 600; color: var(--muted); letter-spacing: -0.01em; }
  .gradeline { display: flex; align-items: center; gap: 0.75rem; margin: 0.5rem 0 0; color: var(--muted); font-size: 1rem; }
  .grade { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; border-radius: 0.75rem; padding: 0.15rem 0.75rem; }
  .review { margin: 1.5rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .review li { padding: 0.75rem 1rem; border-radius: 0.875rem; background: var(--bg); border: 1px solid var(--line); font-size: 0.9375rem; line-height: 1.4; }
  .review li span { display: block; color: var(--muted); font-size: 0.875rem; margin-top: 0.15rem; }
  .review h3 { margin: 1.5rem 0 0; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .actions { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.625rem; }

  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (min-width: 40rem) {
    main { padding-top: 2rem; }
    .actions { flex-direction: row; }
  }

  @media (prefers-reduced-motion: reduce) {
    .progress i { transition: none; }
    .btn, .opt { transition: background-color 200ms ease, border-color 200ms ease, opacity 200ms ease; }
    .btn:active, .opt:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .bar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --line: rgba(128, 128, 128, 0.7); }
    .bar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <div class="bar-row">
      <h1 class="brand">🪔 Golu Quiz</h1>
      <span class="counter" id="counter" aria-live="polite"></span>
    </div>
    <p class="note"><b>Step 0 is the floor</b>, step 1 is the one above that, and so on up.</p>
    <div class="progress" aria-hidden="true"><i id="bar-fill"></i></div>
  </div>
</header>

<main id="app"></main>

<script>
(() => {
  'use strict';

  // The highest step number on the golu. Steps run from 0 (floor) up to STEP_COUNT.
  // If your golu has more steps, raise this number and the quiz adapts.
  const STEP_COUNT = 6;

  const QUESTIONS = [
    // General questions
    {
      type: 'general',
      q: 'Golu is displayed during which festival?',
      options: ['Diwali', 'Navratri', 'Pongal', 'Ugadi'],
      answer: 1,
      why: 'Golu is set up for the nine nights of Navratri.'
    },
    {
      type: 'general',
      q: 'How many steps does a traditional golu usually have?',
      options: ['Any even number', 'An odd number', 'Exactly four', 'Exactly twelve'],
      answer: 1,
      why: 'Traditionally the steps are an odd number, such as 3, 5, 7, 9 or 11.'
    },
    {
      type: 'general',
      q: 'Which pair of wooden dolls is traditionally part of a golu?',
      options: ['Marapachi bommai', 'Kalasam', 'Thoranam', 'Kolam'],
      answer: 0,
      why: 'The marapachi bommai are a wooden bride and groom, often passed down in a family.'
    },
    {
      type: 'general',
      q: 'Why is Dasara celebrated?',
      options: [
        'To mark the victory of good over evil',
        'To mark the triumph of the Hindu deity Lord Rama over the ten-headed demon king Ravana',
        'To mark Goddess Durga’s victory over the buffalo demon Mahishasura',
        'All of the above',
        'None of the above'
      ],
      answer: 3,
      why: 'Dasara celebrates the victory of good over evil, remembered through both Rama’s triumph over Ravana and Durga’s victory over Mahishasura.'
    },

    // Find-it-on-the-golu questions (answer = step number)
    { type: 'step', q: 'Where are the nested penguins?', answer: 2 },
    { type: 'step', q: 'Where are the 6 birds?', answer: 1 },
    { type: 'step', q: 'Where is the fire above water?', answer: 2 },
    { type: 'step', q: 'Where is the polar bear?', answer: 2 },
    { type: 'step', q: 'Where is the well?', answer: 4 },
    { type: 'step', q: 'Where is the quartet?', answer: 5 },
    { type: 'step', q: 'Where is the sugarcane?', answer: 4 },
    { type: 'step', q: 'Where are the enlightened people?', answer: 6 }
  ];

  const app = document.getElementById('app');
  const bar = document.getElementById('bar-fill');
  const counter = document.getElementById('counter');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  let i = 0;
  let score = 0;
  let picks = [];
  let locked = false;
  let screen = 'start';

  const stepName = (n) => (n === 0 ? 'Step 0 (the floor)' : 'Step ' + n);
  const answerText = (q) => (q.type === 'step' ? stepName(q.answer) : q.options[q.answer]);
  const pickText = (q, v) => (q.type === 'step' ? stepName(v) : q.options[v]);

  // Grade scale. Each entry is the lowest percent that earns that grade.
  // B vs B+ split (87) is my assumption; change it here if your scale differs.
  const GRADES = [
    [90, 'A'], [87, 'B+'], [85, 'B'], [80, 'B-'],
    [70, 'C'], [65, 'C-'], [60, 'D+'], [40, 'D'], [0, 'N']
  ];
  const gradeFor = (pct) => GRADES.find((g) => pct >= g[0])[1];

  // Result headlines: one is picked at random from the tier you land in. Add your own!
  const PHRASES = {
    perfect: [
      'Golu master! Even the marapachi couple is bowing to you.',
      'Flawless. Come judge our golu next year.',
      'Perfect score. Not a single doll got past you.',
      'You have officially earned all the sundal.'
    ],
    great: [
      'Excellent eye! Sundal for you.',
      'Sharp. You could run the golu inspection committee.',
      'So close to perfect. One doll is hiding and laughing.',
      'The dolls are impressed, and they never are.'
    ],
    okay: [
      'Nicely done. The dolls give you a polite nod.',
      'Not bad! You clearly walked past the golu at least once.',
      'Respectable. A few dolls are still hiding from you.',
      'Halfway up the steps. Keep climbing!'
    ],
    rough: [
      'Time for another look. The dolls saw everything.',
      'Did you even look at the steps?',
      'Step 0 is the floor. Your score is not far above it.',
      'Even the polar bear looked away.',
      'Go ask for sundal and then look again.',
      'The penguins nested better than you studied.'
    ]
  };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // Fisher-Yates shuffle, in place
  function shuffle(arr) {
    for (let a = arr.length - 1; a > 0; a--) {
      const b = Math.floor(Math.random() * (a + 1));
      [arr[a], arr[b]] = [arr[b], arr[a]];
    }
    return arr;
  }

  function setProgress(p) {
    bar.style.transform = 'scaleX(' + Math.max(0, Math.min(1, p)) + ')';
  }

  // Materialize the new screen: slide up with a soft spring-like curve (fade only for reduced motion)
  function enter(el) {
    if (!el || !el.animate) return;
    const frames = reduce.matches
      ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }];
    el.animate(frames, { duration: reduce.matches ? 150 : 420, easing: 'cubic-bezier(0.2, 0.9, 0.25, 1)' });
  }

  function showStart() {
    screen = 'start';
    counter.textContent = '';
    setProgress(0);
    app.innerHTML =
      '<section class="card" id="card">' +
        '<p class="eyebrow">Navratri golu</p>' +
        '<h1>How well do you know our golu?</h1>' +
        '<p class="lede">' + QUESTIONS.length + ' questions: golu general knowledge mixed with a hunt for things on the display, in a different order every time. Check the note up top for how the steps are numbered.</p>' +
        '<button class="btn block" id="begin">Start the quiz</button>' +
      '</section>';
    enter(document.getElementById('card'));
    document.getElementById('begin').addEventListener('click', () => {
      i = 0; score = 0; picks = [];
      shuffle(QUESTIONS); // new order every time you play
      showQuestion();
    });
  }

  function showQuestion() {
    screen = 'question';
    locked = false;
    const q = QUESTIONS[i];
    const isStep = q.type === 'step';
    const last = i === QUESTIONS.length - 1;

    counter.textContent = (i + 1) + ' / ' + QUESTIONS.length;
    setProgress(i / QUESTIONS.length);

    let opts;
    if (isStep) {
      opts = [];
      for (let n = STEP_COUNT; n >= 0; n--) {
        const w = 56 + (44 * (STEP_COUNT - n)) / STEP_COUNT; // narrow at the top, full width at the floor
        opts.push({ value: n, label: n === 0 ? 'Step 0 · Floor' : 'Step ' + n, width: w.toFixed(1) + '%' });
      }
    } else {
      opts = q.options.map((t, k) => ({ value: k, label: t }));
    }

    app.innerHTML =
      '<section class="card" id="card">' +
        '<p class="eyebrow">' + (isStep ? 'Find it on the golu' : 'About golu') + '</p>' +
        '<h2 class="q">' + q.q + '</h2>' +
        (isStep ? '<p class="cap">Top</p>' : '') +
        '<div class="opts' + (isStep ? ' steps' : '') + '" role="group" aria-label="Answer choices">' +
          opts.map((o) =>
            '<button class="opt" data-v="' + o.value + '"' + (o.width ? ' style="--w:' + o.width + '"' : '') + '>' +
              '<span class="lbl">' + o.label + '</span><span class="mark" aria-hidden="true"></span>' +
            '</button>'
          ).join('') +
        '</div>' +
        '<div class="feedback" id="fb" aria-live="polite"></div>' +
        '<button class="btn next" id="next" hidden>' + (last ? 'See results' : 'Next question') + '</button>' +
      '</section>';

    enter(document.getElementById('card'));

    app.querySelectorAll('.opt').forEach((b) => {
      b.addEventListener('click', () => answer(Number(b.dataset.v)));
    });
    document.getElementById('next').addEventListener('click', () => {
      i += 1;
      if (i < QUESTIONS.length) showQuestion(); else showResults();
    });
  }

  function answer(v) {
    if (locked || screen !== 'question') return;
    locked = true;
    const q = QUESTIONS[i];
    const ok = v === q.answer;
    picks[i] = v;
    if (ok) score += 1;

    app.querySelectorAll('.opt').forEach((b) => {
      const bv = Number(b.dataset.v);
      const mark = b.querySelector('.mark');
      b.setAttribute('aria-disabled', 'true');
      if (bv === q.answer) { b.classList.add('correct'); mark.textContent = '✓'; }
      else if (bv === v) { b.classList.add('wrong'); mark.textContent = '✗'; }
      else { b.classList.add('dim'); }
    });

    const fb = document.getElementById('fb');
    fb.className = 'feedback show ' + (ok ? 'good' : 'bad');
    const extra = q.why ? ' ' + q.why : '';
    fb.innerHTML = ok
      ? '<strong>Correct!</strong>' + extra
      : '<strong>Not quite.</strong> The answer is ' + answerText(q) + '.' + extra;

    const next = document.getElementById('next');
    next.hidden = false;
    next.focus({ preventScroll: true });
    next.scrollIntoView({ block: 'nearest', behavior: reduce.matches ? 'auto' : 'smooth' });
  }

  function showResults() {
    screen = 'results';
    counter.textContent = 'Done';
    setProgress(1);
    const n = QUESTIONS.length;
    const ratio = score / n;
    const pct = ratio * 100;
    const pctText = (Number.isInteger(pct) ? pct : pct.toFixed(1)) + '%';
    const grade = gradeFor(pct);
    const tier = ratio === 1 ? 'perfect' : ratio >= 0.8 ? 'great' : ratio >= 0.5 ? 'okay' : 'rough';
    const title = pick(PHRASES[tier]);

    const missed = [];
    QUESTIONS.forEach((q, k) => { if (picks[k] !== q.answer) missed.push(k); });

    app.innerHTML =
      '<section class="card" id="card">' +
        '<p class="eyebrow">Your result</p>' +
        '<h2 class="q" style="margin-bottom:0">' + title + '</h2>' +
        '<p class="score">' + pctText + '</p>' +
        '<p class="gradeline"><span class="grade">' + grade + '</span><span>' + score + ' of ' + n + ' correct</span></p>' +
        (missed.length
          ? '<h3>Review</h3><ul class="review">' +
              missed.map((k) => {
                const q = QUESTIONS[k];
                return '<li>' + q.q + '<span>You said ' + pickText(q, picks[k]) + '. Answer: ' + answerText(q) + '.</span></li>';
              }).join('') +
            '</ul>'
          : '<p class="lede">You got every single one right.</p>') +
        '<div class="actions"><button class="btn" id="again">Play again</button></div>' +
      '</section>';
    enter(document.getElementById('card'));
    document.getElementById('again').addEventListener('click', showStart);
    window.scrollTo({ top: 0, behavior: reduce.matches ? 'auto' : 'smooth' });
  }

  // Keyboard on laptop: press a number to answer.
  // Step questions use the step number itself (0 to STEP_COUNT); general ones use 1, 2, 3...
  document.addEventListener('keydown', (e) => {
    if (screen !== 'question' || locked || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!/^[0-9]$/.test(e.key)) return;
    const d = Number(e.key);
    const q = QUESTIONS[i];
    if (q.type === 'step') {
      if (d <= STEP_COUNT) answer(d);
    } else if (d >= 1 && d <= q.options.length) {
      answer(d - 1);
    }
  });

  showStart();
})();
</script>
</body>
</html>
